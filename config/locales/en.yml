en:
  recording_studio_embargo:
    editor:
      title: Embargo
      subtitle: Lock with embargo and set a release date
      explanation_paragraphs:
        - "An embargo lets you share your press kit with journalists before it's made public, giving them time to prepare their stories."
        - "Journalists who receive early access are expected to keep the information confidential and not publish anything until the embargo date and time."
        - "Embargoes work on an honour system. This tool helps you communicate the embargo and control who has early access, but it cannot prevent someone from sharing or publishing the information early."
        - "Only grant early access to people you trust."
      what_is_an_embargo: What is an embargo
      saved: Embargo saved
      enable: Embargo
      enable_description: Show preview only and mark as embargoed
      lifts_at: Release date and time
      time_zone: Time zone
      time_zone_placeholder: Choose a time zone
      early_access: Early access
      early_access_description: Allow people to request early access
      save: Update
      empty_actions: Nothing is set up to hold back yet.
    notice:
      title: Embargoed until %{time}
      subtitle: Not for publication until embargo lifts.
      time_format: "%-d %b %Y, %-l:%M %p %Z"
    errors:
      unauthorized: You are not allowed to change this embargo.
      parent_required: A recording is required.
      lifts_at_invalid: Enter a real release date and time in the selected time zone.
      lifts_at_required: A release time is required to enable an embargo.
      lifts_at_future: The release time must be in the future.
      time_zone_invalid: Choose a known time zone.
